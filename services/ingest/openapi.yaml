openapi: 3.0.3
info:
  title: Examforge Ingest API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /v1/documents/upload:
    post:
      summary: Upload a document (PDF or PPTX)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                filename:
                  type: string
                mime:
                  type: string
                  enum: [application/pdf, application/vnd.openxmlformats-officedocument.presentationml.presentation]
      responses:
        '200':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
components:
  schemas:
    UploadResponse:
      type: object
      properties:
        document_id:
          type: string
        storage_uri:
          type: string
        status:
          type: string
          enum: [received]
