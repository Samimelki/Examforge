openapi: 3.0.3
info:
  title: Examforge Embed API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /v1/embed:
    post:
      summary: Embed text(s)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedRequest'
      responses:
        '200':
          description: Embeddings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedResponse'
components:
  schemas:
    EmbedRequest:
      type: object
      properties:
        texts:
          type: array
          items:
            type: string
        model:
          type: string
          example: sentence-transformers/all-mpnet-base-v2
    EmbedResponse:
      type: object
      properties:
        vectors:
          type: array
          items:
            type: array
            items:
              type: number
        dim:
          type: integer
