openapi: 3.0.3
info:
  title: Examforge Retriever API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /v1/retrieve:
    post:
      summary: Hybrid retrieval (BM25 + dense, optional reranker)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveRequest'
      responses:
        '200':
          description: Passages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveResponse'
components:
  schemas:
    RetrieveRequest:
      type: object
      properties:
        query:
          type: string
        top_k:
          type: integer
          default: 5
        rerank:
          type: boolean
          default: false
        filters:
          type: object
    Passage:
      type: object
      properties:
        doc_id:
          type: string
        chunk_id:
          type: string
        text:
          type: string
        score:
          type: number
        metadata:
          type: object
    RetrieveResponse:
      type: object
      properties:
        query:
          type: string
        passages:
          type: array
          items:
            $ref: '#/components/schemas/Passage'
