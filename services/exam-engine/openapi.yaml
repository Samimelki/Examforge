openapi: 3.0.3
info:
  title: Examforge Exam-Engine API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /v1/generate:
    post:
      summary: Generate a question from passages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: Generated question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
components:
  schemas:
    Passage:
      type: object
      properties:
        doc_id: { type: string }
        chunk_id: { type: string }
        text: { type: string }
        metadata: { type: object }
    Evidence:
      type: object
      properties:
        ref:
          type: string
          description: "doc_id:page|slide:quote"
    GenerateRequest:
      type: object
      properties:
        passages:
          type: array
          items:
            $ref: '#/components/schemas/Passage'
        question_type:
          type: string
          enum: [mcq, saq]
        settings:
          type: object
    MCQ:
      type: object
      properties:
        stem: { type: string }
        options:
          type: array
          items:
            type: object
            properties:
              text: { type: string }
              correct: { type: boolean }
        rationale: { type: string }
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
    SAQ:
      type: object
      properties:
        prompt: { type: string }
        expected_answer: { type: string }
        rubric: { type: array, items: { type: string } }
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
    GenerateResponse:
      type: object
      properties:
        type:
          type: string
          enum: [mcq, saq]
        payload:
          oneOf:
            - $ref: '#/components/schemas/MCQ'
            - $ref: '#/components/schemas/SAQ'
